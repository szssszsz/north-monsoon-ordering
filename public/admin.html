<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单管理｜北境季风</title><style>*{box-sizing:border-box}body{background:#09141e;color:#e9e5dc;font:14px Arial,"PingFang SC",sans-serif;margin:0;padding:5%;color-scheme:dark}main{max-width:1150px;margin:auto}main>a{font-size:12px;letter-spacing:.1em}h1{font:38px "Songti SC",SimSun,serif;letter-spacing:.12em;margin:35px 0 25px}a{color:#ccb17f;text-decoration:none}#login{padding:28px;background:linear-gradient(145deg,#12232f,#0c1923);border:1px solid #cbb17f52;display:flex;align-items:end;flex-wrap:wrap;gap:18px}#login>.info{flex-basis:100%;margin:0 0 7px}label{display:block;font-size:11px;color:#b9c5c9;max-width:100%}input,button{padding:13px;border:1px solid #a4b5bc44;font:inherit;border-radius:0}input{display:block;background:#07121c;color:#e9e5dc;width:min(400px,100%);margin-top:9px;max-width:100%}button{background:#ccb17f;color:#10202a;cursor:pointer}input:focus-visible,button:focus-visible{outline:2px solid #e4cfaa;outline-offset:3px}table{border-collapse:collapse;min-width:850px;width:100%;margin-top:20px;background:#0e1c27;font-size:12px}th,td{padding:18px 12px;text-align:left;border-bottom:1px solid #cbb17f29;max-width:230px;overflow-wrap:anywhere}th{font-weight:400;color:#ccb17f;background:#13232e;font-size:11px;letter-spacing:.08em}td button{padding:8px 12px;font-size:11px}#records{overflow:auto}.info{line-height:1.9;color:#9fb0b7;font-size:11px}#message{margin:22px 0;color:#e1ad97;line-height:1.8}[hidden]{display:none!important}@media(max-width:600px){body{padding:25px 6%}h1{font-size:31px;margin:30px 0}#login{padding:22px;display:block}label{margin-bottom:18px}input{font-size:16px;width:100%}#login>button{width:100%}}</style></head><body><main><a href="/">← 北境季风</a><h1>订单管理</h1><form id="login"><p class="info">输入专属管理员口令查看和管理全部订单。</p><label>管理员口令 <input id="password" type="password" required autocomplete="current-password"></label><button>登录</button></form><p id="message" role="status"></p><div id="records"></div></main><script>
let csrf='';const labels={mist:'冷萃晨雾',wind:'珍藏气流',cloud:'云端轻享'};
const message=document.getElementById('message'),login=document.getElementById('login'),records=document.getElementById('records');
async function load(){const r=await fetch('/api/admin',{cache:'no-store'});if(!r.ok)return false;const d=await r.json();login.hidden=true;records.replaceChildren();const p=document.createElement('p');p.className='info';p.textContent='最近500笔订单 · 刷新页面查看新记录';records.append(p);const table=document.createElement('table'),tr=document.createElement('tr');for(const x of ['订单编号','称呼','北京时间','人数','料理','备注','状态','操作']){const th=document.createElement('th');th.textContent=x;tr.append(th)}table.append(tr);for(const o of d.orders){const row=document.createElement('tr');for(const v of [o.id,o.name,o.date+' '+o.time,o.guests,JSON.parse(o.items).map(x=>labels[x]).join(' / '),o.note||'—',o.status==='cancelled'?'已取消':'已确认']){const td=document.createElement('td');td.textContent=v;row.append(td)}const action=document.createElement('td');if(o.status!=='cancelled'){const btn=document.createElement('button');btn.textContent='取消预约';let ready=false;btn.onclick=async()=>{if(!ready){ready=true;btn.textContent='确认取消';return;}btn.disabled=true;try{const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({action:'cancel',id:o.id})});const d=await r.json();if(!r.ok)throw Error(d.error);message.textContent='预约已取消。';await load()}catch(e){message.textContent=e.message||'操作失败，请重试';btn.disabled=false}};action.append(btn)}row.append(action);table.append(row)}records.append(table);return true;}
login.addEventListener('submit',async e=>{e.preventDefault();if(!csrf){message.textContent='管理会话正在准备，请稍候。';return;}message.textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({password:document.getElementById('password').value})});document.getElementById('password').value='';const d=await r.json();if(!r.ok)throw Error(d.error);await load()}catch(e){message.textContent=e.message||'暂时无法连接'}});
async function connect(){const button=login.querySelector('button');button.disabled=true;message.textContent='正在连接订单管理…';const deadline=Date.now()+100000;while(Date.now()<deadline){try{const r=await fetch('/api/session',{cache:'no-store',signal:AbortSignal.timeout(Math.min(15000,Math.max(1,deadline-Date.now())))});if(r.ok&&r.headers.get('content-type')?.includes('application/json')){const d=await r.json();if(d.csrf){csrf=d.csrf;button.disabled=false;message.textContent='';await load();return;}}}catch{}await new Promise(resolve=>setTimeout(resolve,1500));}message.textContent='连接暂未就绪，请刷新重试。';}connect();
</script></body></html>
