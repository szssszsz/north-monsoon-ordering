<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单管理｜北境季风</title><style>body{background:#f4f1e9;color:#172730;font:14px Arial,sans-serif;margin:0;padding:5%}main{max-width:1100px;margin:auto}h1{font:36px serif}a{color:#8a6c3d}input,button{padding:13px;border:1px solid #cbbd9e;font:inherit}button{background:#d6b67c;cursor:pointer}table{border-collapse:collapse;min-width:850px;width:100%;margin-top:25px}th,td{padding:15px 10px;text-align:left;border-bottom:1px solid #d7d1c3;max-width:230px;overflow-wrap:anywhere}#records{overflow:auto}.info{line-height:1.9;color:#7c8176;font-size:12px}#message{margin-top:20px;color:#9d432d}</style></head><body><main><a href="/">← 北境季风</a><h1>订单管理</h1><form id="login"><p class="info">输入专属管理员口令查看全部订单。</p><label>管理员口令 <input id="password" type="password" required autocomplete="current-password"></label><button>登录</button></form><p id="message" role="status"></p><div id="records"></div></main><script>
let csrf='';const labels={mist:'冷萃晨雾',wind:'珍藏气流',cloud:'云端轻享'};
const message=document.getElementById('message'),login=document.getElementById('login'),records=document.getElementById('records');
async function load(){const r=await fetch('/api/admin',{cache:'no-store'});if(!r.ok)return false;const d=await r.json();login.hidden=true;records.replaceChildren();const p=document.createElement('p');p.className='info';p.textContent='最近500笔订单 · 刷新页面查看新记录';records.append(p);const table=document.createElement('table'),tr=document.createElement('tr');for(const x of ['订单编号','称呼','北京时间','人数','料理','备注','状态']){const th=document.createElement('th');th.textContent=x;tr.append(th)}table.append(tr);for(const o of d.orders){const row=document.createElement('tr');for(const v of [o.id,o.name,o.date+' '+o.time,o.guests,JSON.parse(o.items).map(x=>labels[x]).join(' / '),o.note||'—',o.status==='cancelled'?'已取消':'已确认']){const td=document.createElement('td');td.textContent=v;row.append(td)}table.append(row)}records.append(table);return true;}
login.addEventListener('submit',async e=>{e.preventDefault();message.textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({password:document.getElementById('password').value})});document.getElementById('password').value='';const d=await r.json();if(!r.ok)throw Error(d.error);await load()}catch(e){message.textContent=e.message||'暂时无法连接'}});
fetch('/api/session').then(r=>r.json()).then(d=>{csrf=d.csrf;return load()}).catch(()=>message.textContent='暂时无法连接，请刷新重试。');
</script></body></html>
